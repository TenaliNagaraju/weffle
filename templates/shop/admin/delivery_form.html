{% extends 'shop/admin/base_admin.html' %}
{% block admin_content %}
<div class="p-4">
    <h1 class="fw-bold mb-4">Add Delivery Agent</h1>
    <div class="card shadow-sm border-0">
        <div class="card-body p-4">
            <form method="post">
                {% csrf_token %}
                <div class="mb-3"><label class="form-label">Username</label><input type="text" name="username" class="form-control" required></div>
                <div class="mb-3"><label class="form-label">Password</label><input type="password" name="password" class="form-control" placeholder="Leave blank for auto-generated"></div>
                <div class="mb-3"><label class="form-label">First Name</label><input type="text" name="first_name" class="form-control"></div>
                {% for field in form %}
                <div class="mb-3"><label class="form-label">{{ field.label }}</label>{{ field }}</div>
                {% endfor %}
                <button type="submit" class="btn btn-weffle">Create Agent</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
