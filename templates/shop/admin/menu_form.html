{% extends 'shop/admin/base_admin.html' %}
{% block admin_content %}
<div class="p-4">
    <h1 class="fw-bold mb-4">{{ title }}</h1>
    <div class="card shadow-sm border-0">
        <div class="card-body p-4">
            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}
                {% for field in form %}
                <div class="mb-3">
                    <label class="form-label">{{ field.label }}</label>
                    {{ field }}
                </div>
                {% endfor %}
                <button type="submit" class="btn btn-weffle">Save</button>
                <a href="{% url 'shop:admin_menu' %}" class="btn btn-outline-secondary">Cancel</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
