{% extends 'shop/base.html' %}
{% block title %}Login — {{ SITE_NAME }}{% endblock %}

{% block content %}
<div class="auth-page min-vh-100 d-flex align-items-center py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5 col-lg-4" data-aos="fade-up">
                <div class="auth-card p-4 p-md-5">
                    <div class="text-center mb-4">
                        <span class="auth-icon">🧇</span>
                        <h2 class="fw-bold">Welcome Back</h2>
                        <p class="text-muted">Login to your {{ SITE_NAME }} account</p>
                    </div>
                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label">Username</label>
                            {{ form.username }}
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            {{ form.password }}
                        </div>
                        <button type="submit" class="btn btn-weffle w-100 py-2">Login</button>
                    </form>
                    <p class="text-center mt-4 mb-0">New here? <a href="{% url 'shop:register' %}" class="fw-semibold">Create account</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
